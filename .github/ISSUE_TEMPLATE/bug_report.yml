name: Bug report
description: Something in agentflow did not do what it says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Security problems do not go here.** Report them privately, as [SECURITY.md](../blob/HEAD/SECURITY.md) describes.

        Before pasting logs, remove secrets, tokens, home-directory paths and hostnames.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands or actions that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: input
    id: agentflow-version
    attributes:
      label: agentflow version
      description: The contents of the `VERSION` file at the repository root.
    validations:
      required: true
  - type: input
    id: loop-or-skill
    attributes:
      label: Which loop or skill
      description: The loop or skill involved, e.g. `/lead-dev`, `/project`, `install`. Write "unsure" if you do not know.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output, if any. It is shown as code, so no backticks are needed.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction
      options:
        - label: I removed secrets, tokens, home-directory paths and hostnames from everything pasted above.
          required: true
