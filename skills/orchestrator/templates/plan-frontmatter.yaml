# Template for plan-file frontmatter — populated by the solution skill
epic: ""                               # Display name; used in ntfy and status.md
spec: ""                               # Path to design doc
phases: []                             # Ordered list of phase names
tasks:
  # 1: {phase: <phase>, deps: [<task_ids>], complexity: low|medium|high, type: standard}
  #
  # `type` (optional, default: "standard"):
  #   - "standard" — orchestrator dispatches the regular implementer-with-verifier-loop wave.
  #   - "tdd"      — orchestrator dispatches the implementer-with-tdd-loop wave instead.
  #                  The wave first writes failing tests against acceptance_criteria (RED),
  #                  then implements until green, then runs the verifier loop. Use for tasks
  #                  with crisp acceptance criteria and an existing test framework.
  #   - "scaffold" — Phase 0 only. Orchestrator dispatches the scaffolder wave (creates files
  #                  with empty signatures + types, NO business logic). The wave MUST emit a
  #                  `ledger_entries` JSON field listing {symbol, path, signature, kind} for
  #                  every public symbol stubbed. After all Phase 0 tasks complete, the
  #                  orchestrator writes the collected entries into the plan body's
  #                  ## Ledger section (between the `<!-- ledger:auto-populated -->` anchor
  #                  and the next `## ` heading), commits the plan as
  #                  `chore(<slug>): ledger`, and flips `ledger.populated: true`. From
  #                  Phase 1 onward, every implementer wave prompt is prepended with the
  #                  Ledger section under `## Source of truth (names/paths)`.
  #   Set on the task with: `type: tdd` / `type: scaffold`. Phases can mix standard and tdd
  #   tasks; `scaffold` is restricted to Phase 0.
test_commands:
  regression: ""                       # Full test command for regression check
  fast: ""                             # Optional faster command for inner loop

# Optional. Operational runbooks injected into every implementer subagent's
# prompt at fire time, BEFORE the task body. Each entry: {path, why}.
# - path resolves relative to repo root, or accepts an absolute path
# - why is a one-line rationale rendered in the injected block header
# Files are read fresh per dispatch (no caching). If a runbook lands mid-epic,
# the next dispatched task picks it up. Already-completed tasks are NOT re-dispatched.
# Read failure on a single file logs WARN to status decision log; dispatch proceeds
# without that file (other entries still inject).
extra_context_files: []
  # Example (uncomment and populate):
  # - path: docs/runbooks/platform-cutover.md
  #   why: "Cutover-day operational reality so implementers don't build dev-only patterns"
  # - path: docs/runbooks/platform-stabilization-smoke.md
  #   why: "Post-cutover smoke checklist; tasks touching the API must pass without rework"

# Canonical join key across spec / plan / status. When present, joins the spec doc
# and status.md to this plan. When absent, parser falls back to filename rule:
# strip leading `YYYY-MM-DD-` and trailing `-design` from the basename.
slug: ""

# Slugs of other epics that must complete (or reach a defined state) before this one
# starts. The inverse `blocks` relation is derived at index time. Unknown slugs
# render as a grayed placeholder card in the swimlane view — visible but distinct.
depends_on: []

# Phase 0 Ledger — canonical name/location reference written back by scaffolder waves.
# `populated` flips true after all Phase 0 (`type: scaffold`) tasks complete and the
# orchestrator has injected ledger_entries into the plan body's `## Ledger` section
# (at the `<!-- ledger:auto-populated -->` anchor). Subsequent task dispatches read
# the populated Ledger section and inject it as `## Source of truth (names/paths)`
# in the implementer prompt.
#
# Skip Phase 0 entirely when the epic is single-task or pure modification of existing
# files. In that case set `populated: true` at plan-creation time so the orchestrator
# does not block waiting on Phase 0 completion.
ledger:
  populated: false
  anchor: "<!-- ledger:auto-populated -->"

# Lifecycle state override. When absent, the dashboard infers state from filesystem
# evidence (status.md exists → running/done; plan exists, no status → planning;
# spec only → speccing). Set explicitly to override:
#   speccing | planning | running | done | archived
# `archived` excludes the record from the default view.
current_state: null

# Optional. Plan-level verification defaults applied to every task. When present,
# orchestrator dispatches each task through the wave-with-verifier loop in addition
# to the orchestrator-level spec-reviewer + code-quality-reviewer (both still run).
# When absent (and per-task verification blocks absent), orchestrator falls back to
# the original implementer + spec-reviewer + code-quality-reviewer flow with a WARN
# entry to the status decision log.
verification:
  global_failure_modes:
    - "Wrong spec format (must match per-task verification.spec_format)"
    - "Scope creep beyond verification.file_allowlist"
    - "Touching files in verification.regression_guard"
    - "Service-config side effects (ProtectHome, systemd unit changes, lockfile mutations)"
    - "Missing tests for new logic"
    - "Stale-branch implementation (assumes different parent state)"
    - "Subagent stall mid-write (incomplete files, truncated diffs)"
    - "Documentation drift (code changed but docstrings/inline comments stale)"
  escalation_threshold_pct: 15        # phase-level escalation-rate guard threshold
  max_fix_iterations: 4               # in-wave verifier loop cap
  wave_deadline_minutes: 30           # plan-default per-wave deadline. Step 4 sub-step 4.0 calls
                                      # agentflow.lifecycle.check_wave_timeouts to detect waves that
                                      # exceed this elapsed time. First timeout → requeue
                                      # (state=ready, re-dispatched next wake). Second timeout
                                      # on the same task → block + escalation. Per-task override
                                      # via the task-level `wave_deadline_minutes` (see below);
                                      # None on a task falls back to this plan default.

# Per-task verification block — populated by solution Step 2.5. Each task
# block is a contract evaluated by the in-wave verifier subagent against the
# implementer's diff + test output. When None (omitted): the wave-with-verifier
# loop is skipped for that task with a WARN entry to the decision log.
#
# Example task with verification block:
# tasks:
#   "5":
#     phase: implement-api
#     deps: [3, 4]
#     complexity: medium
#     wave_deadline_minutes: 45       # per-task override, on the task itself (not under verification:); None (omitted) → use plan-level default (30)
#     verification:
#       acceptance_criteria:
#         - "POST /v1/notes returns 201 with the created note's id"
#         - "A title longer than 200 characters returns 422"
#         - "An unauthenticated request returns 401 and writes no row"
#       file_allowlist:
#         - "src/api/notes.py"
#         - "tests/test_notes.py"
#       regression_guard:
#         - "src/sync_worker.py"
#         - "deploy/notes.service"
#       spec_format: "user story (As a / I want / So that)"
#       failure_modes:
#         - "Request body logged with its auth header"
#         - "An API key leaked into a log line"
#       test_commands:
#         - "pytest tests/test_notes.py -v"
